# Experiments only: no repository writes, update PRs, release artifacts or caches.
name: Go dependency compatibility
on:
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Dependencies (${{ matrix.dependencies }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dependencies: [committed, newer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Test the selected graph inside a disposable workspace
        uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810 # v1.2.2
        with:
          persist-workspace-changes: 'false'
          env: |
            DEPENDENCY_LANE=${{ matrix.dependencies }}
            GOTOOLCHAIN=local
            GOFLAGS=-mod=mod
          run: |
            go version
            if [ "$DEPENDENCY_LANE" = newer ]; then
              go get -u -t ./...
            fi
            go list -m all
            go test -count=1 -race ./...
            if [ "$DEPENDENCY_LANE" = committed ]; then
              test -z "$(git status --porcelain -- go.mod go.sum)"
            fi

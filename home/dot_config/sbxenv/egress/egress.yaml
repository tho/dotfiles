# syntax=docker/sandbox-kit:3
# sbx kit: hosts these dotfiles need inside a sandbox, beyond what sbxenv's
# kits/config allows (GitHub, deb.debian.org, PyPI). Add it to ~/.sbxenv.yaml
# under kits: by absolute path. Recreate sandboxes after a change.
schemaVersion: "3"
displayName: Dotfiles egress
description: Hosts the dotfiles need to install their tools in a sandbox
kind: mixin
# Bump on any change, so `sbx env plan` shows the kit as changed.
version: "1.0.0"
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # The dotfiles apply at create runs during the install phase. On every
      # boot, sbxenv reruns the scripts in the runtime phase, so a script that
      # failed or changed retries then and needs the same hosts.
      install:
        allow: &hosts
          # Hunk's installer and release lookup; hunk.dev redirects to www.
          # Its release download comes from GitHub, which kits/config allows.
          - hunk.dev
          - www.hunk.dev
      runtime:
        allow: *hosts

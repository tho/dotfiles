[aliases]
nclaude = "env HERDR_AGENT=claude nono run -s -p claude-rw --allow-cwd -- claude --permission-mode=auto"
nclaudero = "env HERDR_AGENT=claude nono run -s -p claude-ro --allow-cwd -- claude --permission-mode=auto"
ncodex = "env HERDR_AGENT=codex nono run -s -p codex-rw --allow-cwd -- codex"
ncodexro = "env HERDR_AGENT=codex nono run -s -p codex-ro --allow-cwd -- codex"
npi = "env HERDR_AGENT=pi nono run -s -p pi-rw --allow-cwd -- pi"
npins = "env HERDR_AGENT=pi nono run -s -p pi-rw --allow-cwd -- pi --no-session"
npiro = "env HERDR_AGENT=pi nono run -s -p pi-ro --allow-cwd -- pi"
npirons = "env HERDR_AGENT=pi nono run -s -p pi-ro --allow-cwd -- pi --no-session"

[env]
ASTRO_TELEMETRY_DISABLED = 1
CLAUDE_CODE_ENABLE_TELEMETRY = 0
DISABLE_ERROR_REPORTING = 1
DISABLE_TELEMETRY = 1
DO_NOT_TRACK = 1
EDITOR = "vim"
ENABLE_BETA_TRACING_DETAILED = 0
GH_TELEMETRY = "false"
HOMEBREW_NO_ANALYTICS = 1
PI_OFFLINE = 1
PI_SKIP_VERSION_CHECK = 1
SBX_NO_TELEMETRY = 1

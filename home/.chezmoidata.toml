[aliases]
nclaude = "nono run -s -p claude-rw --allow-cwd"
nclaudero = "nono run -s -p claude-ro --allow-cwd"
ncodex = "nono run -s -p codex-rw --allow-cwd"
ncodexro = "nono run -s -p codex-ro --allow-cwd"
npi = "nono run -s -p pi-rw --allow-cwd"
npins = "nono run -s -p pi-rw-ns --allow-cwd"
npiro = "nono run -s -p pi-ro --allow-cwd"
npirons = "nono run -s -p pi-ro-ns --allow-cwd"

[env]
ASTRO_TELEMETRY_DISABLED = 1
CLAUDE_CODE_ENABLE_TELEMETRY = 0
DISABLE_ERROR_REPORTING = 1
DISABLE_TELEMETRY = 1
DO_NOT_TRACK = 1
EDITOR = "vim"
ENABLE_BETA_TRACING_DETAILED = 0
GH_TELEMETRY = "false"
HOMEBREW_NO_ANALYTICS = 1
HUNK_DISABLE_UPDATE_NOTICE = 1
PI_OFFLINE = 1
PI_SKIP_VERSION_CHECK = 1
SBX_NO_TELEMETRY = 1

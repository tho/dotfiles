[aliases]
claude = "env HERDR_AGENT=claude nono run -s -p claude-rw --allow-cwd -- claude --permission-mode=auto"
claudero = "env HERDR_AGENT=claude nono run -s -p claude-ro --allow-cwd -- claude --permission-mode=auto"
codex = "env HERDR_AGENT=codex nono run -s -p codex-rw --allow-cwd -- codex"
codexro = "env HERDR_AGENT=codex nono run -s -p codex-ro --allow-cwd -- codex"
pi = "env HERDR_AGENT=pi nono run -s -p pi-rw --allow-cwd -- pi"
pins = "env HERDR_AGENT=pi nono run -s -p pi-rw --allow-cwd -- pi --no-session"
piro = "env HERDR_AGENT=pi nono run -s -p pi-ro --allow-cwd -- pi"
pirons = "env HERDR_AGENT=pi nono run -s -p pi-ro --allow-cwd -- pi --no-session"

[env]
ASTRO_TELEMETRY_DISABLED = 1
CLAUDE_CODE_ENABLE_TELEMETRY = 0
DISABLE_ERROR_REPORTING = 1
DISABLE_TELEMETRY = 1
DO_NOT_TRACK = 1
EDITOR = "vim"
ENABLE_BETA_TRACING_DETAILED = 0
GH_TELEMETRY = "false"
HOMEBREW_NO_ANALYTICS = 1
PI_OFFLINE = 1
PI_SKIP_VERSION_CHECK = 1
SBX_NO_TELEMETRY = 1
